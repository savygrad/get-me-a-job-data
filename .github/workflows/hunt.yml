name: Hunt engine

# Get Me A JOB hunt engine — installed into the user's own data repo at
# .github/workflows/hunt.yml (template: engine/hunt.yml in the app repo).
# Started by the web page via workflow_dispatch; reads data/*.json from the
# checkout, runs node engine/hunt.mjs, and the engine git-commits progress
# back to data/ so the page can poll and display it.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    env:
      GIT_AUTHOR_NAME: "get-me-a-job engine"
      GIT_AUTHOR_EMAIL: "engine@users.noreply.github.com"
      GIT_COMMITTER_NAME: "get-me-a-job engine"
      GIT_COMMITTER_EMAIL: "engine@users.noreply.github.com"
    steps:
      - name: Check out the data repo
        uses: actions/checkout@v4
        # persist-credentials defaults to true: the checkout keeps the
        # Actions token so the engine's git pushes back to data/ work.

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure git identity
        run: |
          git config user.name "get-me-a-job engine"
          git config user.email "engine@users.noreply.github.com"

      - name: Run the hunt engine
        run: node engine/hunt.mjs
